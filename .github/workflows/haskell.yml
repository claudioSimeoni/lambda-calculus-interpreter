name: Haskell CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Check formatting first using the official action (runs in ~5s)
    - name: Check Fourmolu Formatting
      uses: fourmolu/fourmolu-action@v10
      with:
        version: "0.14.1.0" # Set to your desired Fourmolu version

    # 2. Setup Haskell tools
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.8.2'
        cabal-version: '3.10.3.0'

    # 3. Cache dependencies
    - name: Cache
      uses: actions/cache@v4
      env:
        cache-name: cache-cabal
      with:
        path: ~/.cabal
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    # 4. Build dependencies & project
    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies --enable-tests --enable-benchmarks

    - name: Build
      run: cabal build --enable-tests --enable-benchmarks all

    - name: Run tests
      run: cabal test all