name: Haskell CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Read Fourmolu version
      id: fourmolu-version
      run: |
        version="$(cat .fourmolu-version)"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid Fourmolu version in .fourmolu-version: $version" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # 1. Check formatting with the maintained Fourmolu action
    - name: Check Fourmolu Formatting
      uses: haskell-actions/run-fourmolu@v12
      with:
        version: ${{ steps.fourmolu-version.outputs.version }}

    # 2. Setup Haskell tools
    - name: Setup Haskell
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.14.1'
        cabal-version: '3.18.1.0'
        cabal-update: false

    # 3. Cache dependencies
    - name: Cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.setup-haskell.outputs.cabal-store }}
          ~/.cabal/packages
          dist-newstyle
        key: ${{ runner.os }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-cabal-${{ steps.setup-haskell.outputs.cabal-version }}-${{ hashFiles('**/*.cabal', '**/cabal.project*') }}
        restore-keys: |
          ${{ runner.os }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-cabal-${{ steps.setup-haskell.outputs.cabal-version }}-

    # 4. Build dependencies & project
    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies --enable-tests --enable-benchmarks

    - name: Build
      run: cabal build --enable-tests --enable-benchmarks all

    - name: Run tests
      run: cabal test all
